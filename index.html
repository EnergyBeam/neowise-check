<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; cursor: pointer; }
    .notice { margin-top: 1rem; padding: .75rem 1rem; border-radius: 6px; background: #fff4e5; border: 1px solid #f0c36d; }
    .notice[hidden], .card[hidden] { display: none; }
    .card { margin-top: 1rem; padding: 1rem; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa; }
    .topic { font-weight: 600; margin: 0 0 .5rem; }
    .draft { white-space: pre-wrap; margin: 0; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4" placeholder="Вставьте текст обращения клиента..."></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

  <section id="result-card" class="card" aria-live="polite" hidden>
    <p class="topic">Тема: <span id="topic"></span></p>
    <p class="draft" id="draft"></p>
  </section>

  <script type="module">
    const TOPIC_LABELS = {
      delivery: "Доставка (delivery)",
      pricing: "Цена и стоимость (pricing)",
      other: "Другое (other)",
    };

    const form = document.querySelector("form");
    const messageInput = document.querySelector("#message");
    const noticeEl = document.querySelector("#notice");
    const cardEl = document.querySelector("#result-card");
    const topicEl = document.querySelector("#topic");
    const draftEl = document.querySelector("#draft");

    let latestRequestId = 0;
    let activeController = null;

    function clearResult() {
      topicEl.textContent = "";
      draftEl.textContent = "";
      cardEl.hidden = true;
    }

    function showNotice(text) {
      noticeEl.textContent = text;
      noticeEl.hidden = false;
    }

    function hideNotice() {
      noticeEl.textContent = "";
      noticeEl.hidden = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (activeController) activeController.abort();
      activeController = new AbortController();
      const currentId = ++latestRequestId;

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: messageInput.value }),
          signal: activeController.signal,
        });

        const data = await reply.json();
        if (currentId !== latestRequestId) return;

        if (reply.status === 400 || data.status === "invalid_input") {
          clearResult();
          showNotice("Введите непустой текст заявки.");
          return;
        }

        if (data.status === "ready") {
          hideNotice();
          topicEl.textContent = TOPIC_LABELS[data.topic] || data.topic;
          draftEl.textContent = data.draft;
          cardEl.hidden = false;
          return;
        }

        clearResult();
        showNotice("AI не смог автоматически разобрать заявку. Требуется ручной разбор — предыдущий черновик очищен.");
      } catch (err) {
        if (err.name === "AbortError" || currentId !== latestRequestId) return;
        clearResult();
        showNotice("Не удалось получить ответ от сервера. Разберите заявку вручную.");
      }
    });
  </script>
</body>
</html>
